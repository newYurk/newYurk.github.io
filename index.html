<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>newYurk</title>
    <meta name="description" content="Темари, Ролльня, Ротишница." />
    <meta name="theme-color" content="#ece8e1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
    <style>
      :root {
        --ink: #0c0b09;
        --linen: #ece8e1;
        --stone: #8a847c;
        --line: color-mix(in oklab, #0c0b09 12%, transparent);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--linen);
        color: var(--ink);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 3rem 1.4rem 4rem;
      }
      main { max-width: 26rem; margin: 0 auto; width: 100%; }
      .kicker {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--stone);
        margin: 0 0 0.6rem;
      }
      h1 {
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        font-weight: 500;
        font-size: clamp(2.4rem, 8vw, 3.2rem);
        letter-spacing: -0.03em;
        margin: 0 0 2.2rem;
      }
      a.game {
        display: block;
        padding: 1.05rem 0;
        border-top: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
      }
      a.game:last-of-type { border-bottom: 1px solid var(--line); }
      a.game strong {
        display: block;
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        font-size: 1.7rem;
        font-weight: 500;
      }
      a.game span {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.88rem;
        color: var(--stone);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">игры</p>
      <h1>newYurk</h1>
      <a class="game" href="https://newyurk.github.io/temari/index.html">
        <strong>Темари</strong>
        <span>нить на сфере</span>
      </a>
      <a class="game" href="https://newyurk.github.io/rollery/">
        <strong>Ролльня</strong>
        <span>лист → спираль → срез</span>
      </a>
      <a class="game" href="https://newyurk.github.io/roti-stand/">
        <strong>Ротишница</strong>
        <span>стойка роти</span>
      </a>
    </main>
  </body>
</html>
